name: Actualizar panel

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: panel-egrefest
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - id: pages
        uses: actions/configure-pages@v6

      - name: Bajar estado anterior desde Pages
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -eu
          mkdir -p data
          for f in cenas historial; do
            code=$(curl -sS -o "data/$f.json" -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE_URL/data/$f.json?t=$(date +%s)")
            echo "$f.json -> HTTP $code"
            echo "$code" > "data/$f.code"
          done
          c1=$(cat data/cenas.code); c2=$(cat data/historial.code)
          rm data/*.code
          if [ "$c1" = 404 ] && [ "$c2" = 404 ]; then
            echo "Primera corrida: se arranca de cero"
            rm -f data/cenas.json data/historial.json
          elif [ "$c1" = 200 ] && [ "$c2" = 200 ]; then
            node -e "JSON.parse(require('fs').readFileSync('data/cenas.json','utf8')); JSON.parse(require('fs').readFileSync('data/historial.json','utf8'))"
          else
            echo "No se pudo bajar el estado anterior (cenas=$c1, historial=$c2). No se publica." >&2
            exit 1
          fi

      - name: Revisar cenas
        run: node scraper.mjs

      - name: Armar sitio
        run: |
          mkdir _site
          cp index.html _site/
          cp -r data _site/data

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Avisar por Telegram
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node bot/avisar.mjs
