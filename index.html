<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3A0F25">
<link rel="icon" href="data:,">
<title>Cenas de egresados · Panel de entradas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root {
  --malbec: #3A0F25; --malbec-claro: #5E1A3C;
  --champagne: #F6E7C8; --rosado: #E3BFD0;
  --papel: #FBF1DF; --papel-agotada: #E7DCCD; --tinta: #2A0A1A;
  --boton: #5E1A3C;
  --venta: #2E7D52; --agotada: #9C2F4A; --proximamente: #2F5D8A;
  --pocas: #C2410C; --vivo: #6EE7A8;
  --caja-venta: #F3E6CF; --caja-agotada: #EADFD6; --caja-proxima: #DCE6F1;
  --talon: 96px;
  --display: "Big Shoulders Display", "Arial Narrow", sans-serif;
  --texto: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--malbec); }
body {
  margin: 0; min-height: 100vh; color: var(--champagne); font: 400 16px/1.4 var(--texto);
  background: radial-gradient(ellipse 130% 55% at 50% -8%, var(--malbec-claro) 0%, var(--malbec) 72%) no-repeat, var(--malbec);
}
.contenedor { max-width: 1180px; margin: 0 auto; padding: 16px 16px 48px; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--vivo); outline-offset: 2px; }

.linea-estado { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; font-size: .74rem; color: var(--rosado); }
.en-vivo { display: flex; align-items: center; gap: 7px; min-width: 0; }
.punto { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--vivo); }
.punto.atrasado { background: var(--rosado); opacity: .6; }
.pildora { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 999px; border: 1px solid rgba(227, 191, 208, .4); background: rgba(246, 231, 200, .08); font-size: .72rem; font-weight: 700; text-decoration: none; white-space: nowrap; color: var(--champagne); }
.pildora[aria-pressed="true"] { background: var(--champagne); color: var(--malbec); border-color: var(--champagne); }
.aviso { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: rgba(246, 231, 200, .12); border: 1px solid var(--champagne); font-weight: 600; }
h1 { margin: 14px 0 8px; font: 900 clamp(52px, 14vw, 96px)/.9 var(--display); letter-spacing: .005em; color: var(--champagne); }
.subtitulo { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 0 16px; }
.subtitulo .pildora { flex: none; }
.resumen { margin: 0; flex: 1 1 auto; min-width: 0; font-size: .84rem; color: var(--rosado); }
.resumen b { font: inherit; font-weight: 800; color: var(--champagne); }

.layout { display: flex; flex-direction: column; gap: 14px; }
.principal { min-width: 0; }
.notificadas { order: -1; border-radius: 14px; border: 1px solid rgba(227, 191, 208, .35); background: rgba(246, 231, 200, .07); }
.notificadas[hidden] { display: none; }
.notif-toggle { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 11px 14px; border: 0; background: none; font-weight: 700; text-align: left; }
.flecha { transition: transform .2s; }
.notif-toggle[aria-expanded="true"] .flecha { transform: rotate(180deg); }
.notif-cuerpo { padding: 0 14px 12px; }
.notif-cuerpo[hidden] { display: none; }
.notif-lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.notif-lista li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 9px 0; border-top: 1px solid rgba(227, 191, 208, .2); }
.notif-lista .n-nombre { flex: 1 1 100%; font-weight: 600; font-size: .9rem; }
.notif-lista a { margin-left: auto; font-size: .8rem; font-weight: 700; color: var(--rosado); text-underline-offset: 3px; }
.notif-nota { margin: 8px 0 0; font-size: .74rem; color: var(--rosado); }
.etq { font-size: .64rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; color: #fff; white-space: nowrap; }
.etq.EN_VENTA { background: var(--venta); }
.etq.AGOTADA { background: var(--agotada); }
.etq.PROXIMAMENTE { background: var(--proximamente); }
.etq.POCAS { background: var(--pocas); }
@media (min-width: 1100px) {
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; align-items: start; }
  .contenedor.con-notif .layout { grid-template-columns: minmax(0, 1fr) 280px; }
  .contenedor.con-notif .subtitulo { margin-right: 304px; }
  .notificadas { order: 0; position: sticky; top: 16px; }
  .notif-toggle { pointer-events: none; }
  .flecha { display: none; }
  .notif-cuerpo[hidden] { display: block; }
}

.herramientas { display: flex; gap: 8px; position: relative; }
.buscador { flex: 1; min-width: 0; font: inherit; padding: 11px 14px; border-radius: 12px; border: 1px solid rgba(227, 191, 208, .35); background: rgba(246, 231, 200, .08); color: var(--champagne); }
.buscador::placeholder { color: var(--rosado); opacity: .8; }
.ordenar { flex: none; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(227, 191, 208, .35); background: rgba(246, 231, 200, .08); font-weight: 600; }
.menu-orden { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 190px; padding: 6px; border-radius: 12px; background: var(--papel); color: var(--tinta); box-shadow: 0 10px 30px rgba(0, 0, 0, .45); display: flex; flex-direction: column; }
.menu-orden[hidden] { display: none; }
.menu-orden button { text-align: left; padding: 10px 12px; border: 0; border-radius: 8px; background: none; font-weight: 600; }
.menu-orden button[aria-checked="true"] { background: rgba(94, 26, 60, .12); }
.menu-orden button[aria-checked="true"]::after { content: " ✓"; }

.pestanas { display: flex; gap: 6px; margin: 14px 0 14px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.pestanas::-webkit-scrollbar { display: none; }
.pestanas button { flex: none; display: flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 999px; border: 1px solid rgba(227, 191, 208, .35); background: transparent; font-weight: 600; font-size: .92rem; }
.pestanas button .n { font: 800 .95rem/1 var(--display); padding: 2px 7px; border-radius: 999px; background: rgba(246, 231, 200, .14); }
.pestanas button[aria-selected="true"] { background: var(--champagne); color: var(--malbec); border-color: var(--champagne); }
.pestanas button[aria-selected="true"] .n { background: rgba(58, 15, 37, .14); }

.grilla { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px 20px; align-items: start; }
@media (min-width: 760px) { .grilla { grid-template-columns: repeat(2, minmax(0, 1fr)); } :root { --talon: 108px; } }
@media (min-width: 1100px) { .grilla { grid-template-columns: repeat(3, minmax(0, 1fr)); } .contenedor.con-notif .grilla { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.vacio { grid-column: 1 / -1; text-align: center; padding: 48px 0; color: var(--rosado); }

.entrada { position: relative; margin-top: 8px; color: var(--tinta); --fondo: var(--papel); --suave: rgba(42, 10, 26, .66); min-width: 0; }
.entrada.AGOTADA { --fondo: var(--papel-agotada); --suave: rgba(42, 10, 26, .5); }
.entrada.AGOTADA .nombre, .entrada.AGOTADA .num, .entrada.AGOTADA .dias { color: rgba(42, 10, 26, .62); }
.ticket { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) var(--talon); cursor: pointer; }
.papel {
  position: absolute; inset: 0; background: var(--fondo); border-radius: 18px;
  -webkit-mask: radial-gradient(circle 10px at calc(100% - var(--talon)) 0, #0000 98%, #000), radial-gradient(circle 10px at calc(100% - var(--talon)) 100%, #0000 98%, #000);
  -webkit-mask-composite: source-in;
  mask: radial-gradient(circle 10px at calc(100% - var(--talon)) 0, #0000 98%, #000), radial-gradient(circle 10px at calc(100% - var(--talon)) 100%, #0000 98%, #000);
  mask-composite: intersect;
}
.entrada.abierta .papel { border-radius: 18px 18px 0 0; }
.cuerpo { position: relative; padding: 18px 12px 16px 18px; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.fecha { margin: 0; font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); }
.nombre { margin: 0; font: 800 17px/1.2 var(--texto); overflow-wrap: break-word; word-break: normal; }
@media (min-width: 760px) { .nombre { font-size: 18px; } }
.activa { margin: 2px 0 0; font-size: .86rem; font-weight: 700; }
.activa[hidden], .disp[hidden], .sin-cantidad[hidden], .proxima-tanda[hidden] { display: none; }
.disp { display: flex; flex-direction: column; gap: 5px; }
.barra { height: 8px; border-radius: 999px; background: rgba(42, 10, 26, .14); overflow: hidden; }
.relleno { height: 100%; width: 0; border-radius: 999px; background: var(--venta); transition: width .6s ease; }
.relleno.pocas { background: var(--pocas); }
.relleno.azul { background: var(--proximamente); }
.entrada.AGOTADA .disp .relleno { background: var(--agotada); }
.fila-disp { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; font-size: .8rem; }
.fila-disp .cant { flex: none; font-weight: 700; }
.fila-disp .ritmo { flex: 1 1 auto; min-width: 0; text-align: right; color: var(--suave); }
.sin-cantidad, .proxima-tanda { margin: 0; font-size: .84rem; font-weight: 600; color: var(--proximamente); }
.ver-detalle { align-self: flex-start; padding: 2px 0; border: 0; background: none; font-size: .86rem; font-weight: 700; color: var(--boton); text-decoration: underline; text-underline-offset: 3px; }
.acciones { display: flex; gap: 8px; margin-top: 4px; }
.campana { display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; font-weight: 700; border-radius: 12px; }
.comprar { flex: 1; text-align: center; text-decoration: none; background: var(--boton); color: var(--champagne); padding: 11px 12px; border-radius: 12px; font-weight: 800; }
.entrada .campana { background: rgba(94, 26, 60, .1); color: var(--boton); border: 1px solid rgba(94, 26, 60, .35); }
.entrada .campana.icono { flex: none; width: 46px; font-size: 1.1rem; }
.entrada .campana.grande { flex: 1; padding: 11px 12px; text-align: center; }
.entrada .campana[aria-pressed="true"] { background: var(--boton); color: var(--champagne); border-color: var(--boton); }

.talon { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; padding: 46px 6px 16px; border-left: 2px dashed rgba(42, 10, 26, .32); gap: 2px; }
.talon small { font-size: .72rem; font-weight: 600; color: var(--suave); line-height: 1.15; }
.num { font: 900 3.1rem/.95 var(--display); color: var(--tinta); }
.num.azul { color: var(--proximamente); }
.talon hr { width: 44px; margin: 8px 0 6px; border: 0; border-top: 2px dashed rgba(42, 10, 26, .32); }
.dias { font: 800 1.35rem/1 var(--display); color: var(--tinta); }

.sello { position: absolute; top: 12px; right: 6px; transform: rotate(9deg); padding: 2px 7px; border: 2px solid currentColor; border-radius: 5px; font-size: .64rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; background: rgba(251, 241, 223, .55); pointer-events: none; white-space: nowrap; }
.sello.EN_VENTA { color: var(--venta); }
.sello.AGOTADA { color: var(--agotada); background: rgba(231, 220, 205, .6); }
.sello.PROXIMAMENTE { color: var(--proximamente); }
.sello.cae { animation: caida .4s cubic-bezier(.2, .8, .3, 1.3); }
@keyframes caida { from { transform: scale(2.4) rotate(-22deg); opacity: 0; } to { transform: scale(1) rotate(9deg); opacity: 1; } }
.etiqueta-pocas { position: absolute; z-index: 2; top: -11px; left: 18px; padding: 3px 10px; border-radius: 999px; background: var(--vivo); color: #0b3d27; font-size: .72rem; font-weight: 800; letter-spacing: .03em; }
.etiqueta-pocas[hidden] { display: none; }
.sacude { animation: sacude .45s ease; }
@keyframes sacude { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-16deg); } 40% { transform: rotate(13deg); } 60% { transform: rotate(-9deg); } 80% { transform: rotate(5deg); } }

.detalle { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; background: var(--fondo); border-radius: 0 0 18px 18px; }
.entrada.abierta .detalle { grid-template-rows: 1fr; }
.detalle > div { overflow: hidden; min-height: 0; }
.detalle .interior { padding: 0 18px; }
.entrada.abierta .detalle .interior { padding: 14px 18px 16px; border-top: 2px dashed rgba(42, 10, 26, .28); }
.tandas { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.caja { display: flex; flex-direction: column; gap: 6px; padding: 9px 11px; border-radius: 12px; font-size: .84rem; background: var(--caja-venta); }
.caja.agotada { background: var(--caja-agotada); }
.caja.proxima { background: var(--caja-proxima); }
.caja .fila { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.caja .etqs { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
.t-nombre { flex: 0 1 auto; min-width: 0; font-weight: 800; overflow-wrap: break-word; }
.t-texto { margin: 0; flex: 1 1 auto; min-width: 0; font-weight: 600; color: var(--proximamente); }
.caja.proxima .barra { background: rgba(47, 93, 138, .2); }
.caja .cant { font-weight: 700; }
.caja .precio { font-weight: 700; white-space: nowrap; }
.sin-mas { margin: 0 0 12px; font-size: .76rem; color: var(--suave); }
.total { margin: 0 0 12px; padding: 11px 14px; border-radius: 12px; background: var(--malbec); color: var(--champagne); font-weight: 700; text-align: center; }
.cerrar { display: block; margin: 0 auto; padding: 4px 8px; border: 0; background: none; font-weight: 700; color: var(--boton); text-decoration: underline; text-underline-offset: 3px; }

.hoja { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.hoja[hidden] { display: none; }
.hoja-fondo { position: absolute; inset: 0; background: rgba(20, 5, 12, .6); opacity: 0; transition: opacity .3s; }
.hoja-panel { position: relative; width: 100%; max-width: 640px; max-height: 88vh; display: flex; flex-direction: column; background: var(--papel); color: var(--tinta); border-radius: 20px 20px 0 0; transform: translateY(100%); transition: transform .3s ease; }
.hoja.abierta .hoja-fondo { opacity: 1; }
.hoja.abierta .hoja-panel { transform: none; }
.hoja-cabecera { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px 10px; border-bottom: 1px solid rgba(42, 10, 26, .12); }
.hoja-cabecera h2 { margin: 0; font: 800 1.15rem/1.2 var(--texto); }
.hoja-cerrar { padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(94, 26, 60, .35); background: rgba(94, 26, 60, .08); color: var(--boton); font-weight: 700; }
.hoja-cuerpo { overflow-y: auto; padding: 4px 18px 20px; overscroll-behavior: contain; }
.hist-dia { margin: 16px 0 6px; font-size: .78rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); }
.hist-fila { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid rgba(42, 10, 26, .08); }
.circ { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 800 .82rem/1 var(--display); color: #fff; letter-spacing: .02em; }
.hist-texto { flex: 1; min-width: 0; font-size: .86rem; line-height: 1.3; }
.hist-texto b { display: block; font-weight: 800; overflow-wrap: anywhere; }
.hist-hora { flex: none; font-size: .74rem; font-weight: 600; color: var(--suave); text-align: right; }
.hist-mas { display: block; margin: 14px auto 0; padding: 9px 20px; border-radius: 999px; border: 1px solid rgba(94, 26, 60, .35); background: rgba(94, 26, 60, .08); color: var(--boton); font-weight: 700; }
.hist-vacio { padding: 28px 0; text-align: center; color: var(--suave); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="contenedor" id="contenedor">
  <div class="linea-estado">
    <span class="en-vivo"><span class="punto" id="punto"></span><span id="revision">Cargando…</span></span>
    <a class="pildora" id="todas" target="_blank" rel="noopener noreferrer"></a>
  </div>
  <div id="aviso"></div>
  <h1>Cenas de<br>egresados</h1>
  <div class="subtitulo">
    <p class="resumen" id="resumen"></p>
    <button class="pildora" id="abrir-historial" type="button">🕘 Historial de cambios</button>
  </div>
  <div class="layout" id="layout">
    <div class="principal">
      <div class="herramientas">
        <input class="buscador" id="buscador" type="search" placeholder="Buscar cena o universidad" aria-label="Buscar cena o universidad">
        <button class="ordenar" id="ordenar" type="button" aria-haspopup="menu" aria-expanded="false">Ordenar ▾</button>
        <div class="menu-orden" id="menu-orden" role="menu" hidden></div>
      </div>
      <div class="pestanas" id="pestanas" role="tablist"></div>
      <div class="grilla" id="grilla"></div>
    </div>
    <aside class="notificadas" id="notificadas" hidden>
      <button class="notif-toggle" id="notif-toggle" type="button" aria-expanded="false" aria-controls="notif-cuerpo"><span id="notif-titulo"></span><span class="flecha" aria-hidden="true">▾</span></button>
      <div class="notif-cuerpo" id="notif-cuerpo" hidden>
        <ul class="notif-lista" id="notif-lista"></ul>
        <p class="notif-nota">Se guardan en este dispositivo. En Telegram las ves con /avisos.</p>
      </div>
    </aside>
  </div>
</div>
<div class="hoja" id="hoja" hidden>
  <div class="hoja-fondo" id="hoja-fondo"></div>
  <div class="hoja-panel" role="dialog" aria-modal="true" aria-labelledby="hoja-titulo">
    <div class="hoja-cabecera">
      <h2 id="hoja-titulo">Historial de cambios</h2>
      <button class="hoja-cerrar" id="hoja-cerrar" type="button">Cerrar</button>
    </div>
    <div class="hoja-cuerpo" id="hoja-cuerpo"></div>
  </div>
</div>
<script>
const MIN_ATRASO = 2;
const REFRESCO_MS = 20000;
const MAX_HISTORIAL = 3000;
const PAGINA_HISTORIAL = 100;
const SB_URL = 'https://qslwxcosxxusoxckgpuw.supabase.co/rest/v1';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzbHd4Y29zeHh1c294Y2tncHV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMzcyNjAsImV4cCI6MjEwNjkxMzI2MH0.0vsljlyMlX-oVxSPF6c6cUrDc7gzb-c1UyEa4GtNMr4';
const BOT = 'https://t.me/CenaEgresadosBot';
const CLAVE_AVISOS = 'avisos-telegram';
const ZONA = 'America/Argentina/Buenos_Aires';
const ESTADOS = { EN_VENTA: 'En venta', AGOTADA: 'Agotada', PROXIMAMENTE: 'Próximamente' };
const PESTANAS = [['EN_VENTA', 'En venta'], ['AGOTADA', 'Agotadas'], ['PROXIMAMENTE', 'Próximamente'], ['todas', 'Todas']];
const ORDENES = [['dias', 'Faltan menos días'], ['vendidas', 'Más vendidas']];

const avisos = (() => {
  try {
    const j = JSON.parse(localStorage.getItem(CLAVE_AVISOS));
    return { todas: j?.todas === true, cenas: Array.isArray(j?.cenas) ? j.cenas.map(String) : [] };
  } catch {
    return { todas: false, cenas: [] };
  }
})();
const guardarAvisos = () => { try { localStorage.setItem(CLAVE_AVISOS, JSON.stringify(avisos)); } catch {} };
const st = { datos: null, historial: [], tab: 'todas', orden: 'dias', busqueda: '', inicializado: false, cards: new Map(), conAviso: false, histVisibles: PAGINA_HISTORIAL };

const $ = (id) => document.getElementById(id);
const h = (tag, attrs = {}, ...hijos) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const x of hijos.flat()) if (x != null) el.append(x);
  return el;
};
const reducirMovimiento = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const sinAcentos = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const pesos = (n) => '$' + n.toLocaleString('es-AR');
const cant = (n) => n === null || n === undefined ? 'sin dato' : n.toLocaleString('es-AR');
const entradas = (n) => `${cant(n)} ${n === 1 ? 'entrada' : 'entradas'}`;
const disponibles = (n) => `${cant(n)} ${n === 1 ? 'disponible' : 'disponibles'}`;
const quedan = (n) => `${n === 1 ? 'queda' : 'quedan'} ${cant(n)}`;
const bonito = (n) => (n && n === n.toUpperCase() && n !== n.toLowerCase() ? n.charAt(0) + n.slice(1).toLowerCase() : n);
const porOrden = (a, b) => (a.prioridad ?? 0) - (b.prioridad ?? 0) || a.id - b.id;

function hace(iso) {
  const min = Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 60000));
  if (min < 1) return 'hace menos de 1 min';
  if (min < 60) return `hace ${min} min`;
  const hs = Math.floor(min / 60);
  if (hs < 48) return `hace ${hs} h`;
  return `hace ${Math.floor(hs / 24)} días`;
}
function haceSeg(iso) {
  const s = Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 1000));
  return s < 60 ? `hace ${s} s` : hace(iso);
}

const diaAR = (fecha) => new Intl.DateTimeFormat('en-CA', { timeZone: ZONA }).format(fecha);
const aUTC = (s) => { const [a, m, d] = s.split('-').map(Number); return Date.UTC(a, m - 1, d); };
function diasPara(c) {
  return Math.round((aUTC(diaAR(new Date(c.fechaInicio))) - aUTC(diaAR(new Date()))) / 86400000);
}
function partesFecha(fecha, opciones) {
  return Object.fromEntries(new Intl.DateTimeFormat('es-AR', { ...opciones, timeZone: ZONA }).formatToParts(fecha).map((p) => [p.type, p.value]));
}
const capital = (s) => s.charAt(0).toUpperCase() + s.slice(1);
function fechaCorta(c) {
  if (!c.fechaInicio) return 'Fecha sin dato';
  const p = partesFecha(new Date(c.fechaInicio), { weekday: 'short', day: 'numeric', month: 'long' });
  return `${capital(p.weekday.replace('.', ''))} ${p.day} de ${p.month}`;
}
const pasada = (c) => Date.parse(c.fechaFin ?? c.fechaInicio) < Date.now();
const vendidasDe = (c) => c.tipos.reduce((n, t) => n + (t.cantidadTotal !== null && t.cantidadDisponible !== null ? t.cantidadTotal - t.cantidadDisponible : 0), 0);

function eventosPorCena() {
  const m = new Map();
  for (const e of st.historial) {
    if (!m.has(e.cenaId)) m.set(e.cenaId, []);
    m.get(e.cenaId).push(e);
  }
  return m;
}

function ritmoDe(evs) {
  if (!evs.length) return '';
  const corte = Date.now() - 3600000;
  let fueron = 0;
  for (const e of evs) if (Date.parse(e.fecha) >= corte && (e.evento === 'BAJA_STOCK' || e.evento === 'AGOTADA')) fueron += e.antes - e.despues;
  if (fueron > 0) return `${fueron === 1 ? 'se fue' : 'se fueron'} ${cant(fueron)} en la última hora`;
  const e = evs[0];
  const cuando = hace(e.fecha);
  switch (e.evento) {
    case 'REPOSICION': return `repusieron ${cuando}`;
    case 'AGOTADA': return `se agotó ${cuando}`;
    case 'BAJA_STOCK': return `bajó ${cuando}`;
    case 'APERTURA_VENTA': return `abrió la venta ${cuando}`;
    case 'PRECIO_CAMBIO': case 'PRECIO_SIMBOLICO_ACTIVADO': case 'PRECIO_SIMBOLICO_RESUELTO': return `cambió el precio ${cuando}`;
    case 'NUEVO_TIPO_ENTRADA': return `nueva tanda ${cuando}`;
    case 'NUEVA_CENA': return `se publicó ${cuando}`;
    default: return '';
  }
}

function describirEvento(e) {
  const t = e.tipoEntrada ? bonito(e.tipoEntrada) : 'una tanda';
  switch (e.evento) {
    case 'BAJA_STOCK': return { icono: `−${e.antes - e.despues}`, color: '#C2410C', texto: `Bajó el stock de ${t}: ${quedan(e.despues)}` };
    case 'AGOTADA': return { icono: '0', color: '#9C2F4A', texto: `Se agotó ${t}` };
    case 'REPOSICION': return { icono: `+${e.despues}`, color: '#2E7D52', texto: `Repusieron ${entradas(e.despues)} de ${t}` };
    case 'APERTURA_VENTA': return { icono: '▶', color: '#2E7D52', texto: `Abrió la venta de ${t}` };
    case 'PRECIO_CAMBIO': return { icono: '$', color: '#2F5D8A', texto: `Cambió el precio de ${t}: ${pesos(e.antes)} → ${pesos(e.despues)}` };
    case 'PRECIO_SIMBOLICO_ACTIVADO': return { icono: '$', color: '#6B3FB5', texto: `${t} pasó a precio simbólico: ${pesos(e.antes)} → ${pesos(e.despues)}` };
    case 'PRECIO_SIMBOLICO_RESUELTO': return { icono: '$', color: '#2E7D52', texto: `${t} ya tiene precio real: ${pesos(e.despues)}` };
    case 'NUEVO_TIPO_ENTRADA': return { icono: '+1', color: '#2F5D8A', texto: `Nueva tanda: ${t}` };
    case 'NUEVA_CENA': return { icono: '★', color: '#2E7D52', texto: 'Se publicó la cena' };
    case 'CENA_ELIMINADA': return { icono: '×', color: '#9C2F4A', texto: 'La cena fue eliminada' };
    default: return null;
  }
}

function etiqueta(fase, pocas) {
  const clave = fase === 'EN_VENTA' ? 'EN_VENTA' : fase === 'AGOTADA' ? 'AGOTADA' : 'PROXIMAMENTE';
  return h('span', { class: 'etqs' }, h('span', { class: `etq ${clave}`, text: ESTADOS[clave] }), pocas ? h('span', { class: 'etq POCAS', text: 'Quedan pocas' }) : null);
}

const textoSinCantidad = (t) => `${bonito(t.tipo ?? 'Tanda')} cargada, todavía sin cantidad de entradas`;

function cajaTanda(t) {
  const nombre = bonito(t.tipo ?? 'Tanda');
  const total = t.cantidadTotal;
  if (t.fase === 'SIN_CANTIDAD') {
    return h('li', { class: 'caja proxima' },
      h('div', { class: 'fila' }, h('p', { class: 't-texto', text: textoSinCantidad(t) }), etiqueta('PROXIMA', false)));
  }
  const pocas = t.estado === 'POCAS';
  const libres = t.fase === 'EN_VENTA' ? t.cantidadDisponible : t.fase === 'PROXIMA' ? total : 0;
  const pct = t.fase === 'PROXIMA' ? 100 : total ? (libres ?? 0) / total * 100 : 0;
  const relleno = h('div', { class: `relleno${pocas ? ' pocas' : ''}${t.fase === 'PROXIMA' ? ' azul' : ''}` });
  relleno.style.width = `${Math.max(0, Math.min(100, pct))}%`;
  return h('li', { class: `caja ${t.fase === 'AGOTADA' ? 'agotada' : t.fase === 'PROXIMA' ? 'proxima' : 'venta'}` },
    h('div', { class: 'fila' }, h('span', { class: 't-nombre', text: nombre }), etiqueta(t.fase, t.fase === 'EN_VENTA' && pocas)),
    h('div', { class: 'barra' }, relleno),
    h('div', { class: 'fila' },
      h('span', { class: 'cant', text: `${disponibles(libres)}${total === null ? '' : ` de ${cant(total)}`}` }),
      h('span', { class: 'precio', text: t.precio === null ? '' : pesos(t.precio) })));
}

function pintarCampana(a, id, c, modo) {
  const activa = id === 'todas' ? avisos.todas : avisos.cenas.includes(id);
  const payload = (activa ? 'x' : id === 'todas' ? '' : 'c') + id;
  a.href = `${BOT}?start=${payload}`;
  a.setAttribute('aria-pressed', String(activa));
  if (id === 'todas') {
    a.textContent = activa ? '🔔 Notificando todas' : '🔔 Notificar todas las cenas';
    return;
  }
  if (modo === 'icono') {
    a.textContent = '🔔';
    a.setAttribute('aria-label', activa ? `Dejar de recibir avisos de ${c.nombre}` : `Avisarme de ${c.nombre}`);
  } else {
    const pedido = modo === 'salgan' ? 'Avisame cuando salgan' : 'Avisame cuando habiliten';
    a.textContent = activa ? '🔔 Avisos activados (tocá para quitar)' : `🔔 ${pedido}`;
    a.setAttribute('aria-label', `${activa ? 'Dejar de recibir avisos de' : pedido + ':'} ${c.nombre}`);
  }
}

function sincronizarAvisos() {
  pintarCampana($('todas'), 'todas');
  const porId = new Map((st.datos?.cenas ?? []).map((c) => [String(c.id), c]));
  for (const a of document.querySelectorAll('a.campana[data-cena]')) pintarCampana(a, a.dataset.cena, porId.get(a.dataset.cena), a.dataset.modo);
  renderNotificadas();
}

function alternarAviso(id) {
  if (id === 'todas') avisos.todas = !avisos.todas;
  else avisos.cenas = avisos.cenas.includes(id) ? avisos.cenas.filter((x) => x !== id) : [...avisos.cenas, id];
  guardarAvisos();
  setTimeout(sincronizarAvisos, 0);
}

function campana(c, modo) {
  const id = String(c.id);
  if (!/^[0-9]+$/.test(id)) return null;
  const a = h('a', { class: `campana ${modo === 'icono' ? 'icono' : 'grande'}`, target: '_blank', rel: 'noopener noreferrer', 'data-cena': id, 'data-modo': modo });
  pintarCampana(a, id, c, modo);
  a.addEventListener('click', () => {
    a.classList.remove('sacude');
    void a.offsetWidth;
    a.classList.add('sacude');
    alternarAviso(id);
  });
  a.addEventListener('animationend', () => a.classList.remove('sacude'));
  return a;
}

function renderNotificadas() {
  const porId = new Map((st.datos?.cenas ?? []).map((c) => [String(c.id), c]));
  const filas = [];
  if (avisos.todas) filas.push({ id: 'todas', nombre: 'Todas las cenas', estado: null });
  for (const id of avisos.cenas) {
    const c = porId.get(id);
    if (c) filas.push({ id, nombre: c.nombre, estado: c.vista.estado });
  }
  $('notificadas').hidden = filas.length === 0;
  $('contenedor').classList.toggle('con-notif', filas.length > 0);
  if (!filas.length) return;
  $('notif-titulo').textContent = `Cenas que te notificamos (${filas.length})`;
  $('notif-lista').replaceChildren(...filas.map((f) => {
    const link = h('a', { href: `${BOT}?start=x${f.id}`, target: '_blank', rel: 'noopener noreferrer', text: 'Dejar de avisar' });
    link.addEventListener('click', () => alternarAviso(f.id));
    return h('li', {}, h('span', { class: 'n-nombre', text: f.nombre }), f.estado ? h('span', { class: `etq ${f.estado}`, text: ESTADOS[f.estado] }) : null, link);
  }));
}

function animarNumero(el, desde, hasta) {
  if (reducirMovimiento() || desde === hasta) { el.textContent = cant(hasta); return; }
  const t0 = performance.now();
  const dur = 700;
  const clave = el.dataset.valor;
  const paso = (t) => {
    const k = Math.min(1, (t - t0) / dur);
    if (el.dataset.valor !== clave) return;
    el.textContent = cant(Math.round(desde + (hasta - desde) * (1 - Math.pow(1 - k, 3))));
    if (k < 1) requestAnimationFrame(paso);
  };
  requestAnimationFrame(paso);
}

function crearCard(c) {
  const r = {
    pocas: h('span', { class: 'etiqueta-pocas', text: 'Quedan pocas', hidden: true }),
    fecha: h('p', { class: 'fecha' }),
    nombre: h('h2', { class: 'nombre' }),
    activa: h('p', { class: 'activa' }),
    relleno: h('div', { class: 'relleno' }),
    cant: h('span', { class: 'cant' }),
    ritmo: h('span', { class: 'ritmo' }),
    sinCantidad: h('p', { class: 'sin-cantidad' }),
    proxima: h('p', { class: 'proxima-tanda' }),
    ver: h('button', { class: 'ver-detalle', type: 'button', 'aria-expanded': 'false', text: 'Ver tandas y detalle ▾' }),
    acciones: h('div', { class: 'acciones' }),
    sello: h('span', { class: 'sello' }),
    quedan: h('small'),
    num: h('div', { class: 'num' }),
    leyenda: h('small'),
    dias: h('div', { class: 'dias' }),
    interior: h('div', { class: 'interior' }),
    cerrar: h('button', { class: 'cerrar', type: 'button', text: 'Cerrar detalle ▴' }),
  };
  r.disp = h('div', { class: 'disp' }, h('div', { class: 'barra' }, r.relleno), h('div', { class: 'fila-disp' }, r.cant, r.ritmo));
  const detalle = h('div', { class: 'detalle', inert: true }, h('div', {}, r.interior));
  const ticket = h('div', { class: 'ticket' },
    h('div', { class: 'papel' }),
    h('div', { class: 'cuerpo' }, r.fecha, r.nombre, r.activa, r.disp, r.sinCantidad, r.proxima, r.ver, r.acciones),
    h('div', { class: 'talon' }, r.quedan, r.num, r.leyenda, h('hr'), r.dias, h('small', { text: 'para la cena' })),
    r.sello);
  const card = h('article', { class: 'entrada', 'data-id': c.id }, r.pocas, ticket, detalle);
  card._r = r;
  const alternar = () => {
    const abierta = card.classList.toggle('abierta');
    r.ver.setAttribute('aria-expanded', String(abierta));
    r.ver.textContent = abierta ? 'Ocultar tandas y detalle ▴' : 'Ver tandas y detalle ▾';
    detalle.inert = !abierta;
  };
  ticket.addEventListener('click', (e) => { if (!e.target.closest('a, button')) alternar(); });
  r.ver.addEventListener('click', alternar);
  r.cerrar.addEventListener('click', alternar);
  r.sello.addEventListener('animationend', () => r.sello.classList.remove('cae'));
  return card;
}

function actualizarCard(card, c, evs) {
  const r = card._r;
  const v = c.vista;
  const anterior = card.dataset.estado;
  card.dataset.estado = v.estado;
  card.className = `entrada ${v.estado}${card.classList.contains('abierta') ? ' abierta' : ''}`;
  r.sello.className = `sello ${v.estado}`;
  r.sello.textContent = ESTADOS[v.estado];
  if (st.inicializado && anterior && anterior !== 'EN_VENTA' && v.estado === 'EN_VENTA' && !reducirMovimiento()) {
    void r.sello.offsetWidth;
    r.sello.classList.add('cae');
  }
  r.pocas.hidden = !v.pocas;
  r.fecha.textContent = fechaCorta(c);
  r.nombre.textContent = c.nombre;

  const prox = v.estado === 'PROXIMAMENTE';
  const ordenadas = [...c.tipos].sort(porOrden);
  const actual = c.tipos.find((t) => t.id === v.tandaId);
  r.activa.hidden = r.disp.hidden = prox || !actual;
  if (!r.disp.hidden) {
    const libres = actual.fase === 'EN_VENTA' ? actual.cantidadDisponible : 0;
    const total = actual.cantidadTotal;
    r.activa.textContent = [bonito(actual.tipo ?? 'Tanda'), actual.precio === null ? null : pesos(actual.precio)].filter(Boolean).join(' · ');
    r.relleno.style.width = `${total ? Math.min(100, (libres ?? 0) / total * 100) : 0}%`;
    r.relleno.classList.toggle('pocas', actual.estado === 'POCAS');
    r.cant.textContent = `${disponibles(libres)}${total === null ? '' : ` de ${cant(total)}`}`;
    r.ritmo.textContent = ritmoDe(evs);
  }
  const primera = ordenadas[0];
  r.sinCantidad.hidden = !(prox && primera && primera.fase === 'SIN_CANTIDAD');
  r.sinCantidad.textContent = r.sinCantidad.hidden ? '' : textoSinCantidad(primera);
  r.proxima.hidden = !v.proxima;
  r.proxima.textContent = v.proxima ? `Próxima tanda: ${bonito(v.proxima.tipo ?? 'Tanda')}, ${entradas(v.proxima.cantidad)} a ${pesos(v.proxima.precio)}` : '';

  const vanASalir = prox && v.vanASalir !== null;
  const modo = prox ? (vanASalir ? 'salir' : 'nada') : 'cantidad';
  const numero = modo === 'salir' ? v.vanASalir : modo === 'cantidad' ? (v.estado === 'EN_VENTA' ? (v.disponibles ?? 0) : 0) : null;
  r.num.classList.toggle('azul', modo === 'salir');
  if (modo === 'salir') { r.quedan.textContent = 'van a salir'; r.leyenda.textContent = numero === 1 ? 'entrada' : 'entradas'; }
  else if (modo === 'nada') { r.quedan.textContent = 'todavía'; r.leyenda.textContent = 'no salen a la venta'; }
  else { r.quedan.textContent = numero === 1 ? 'queda' : 'quedan'; r.leyenda.textContent = numero === 1 ? 'entrada disponible' : 'entradas disponibles'; }
  const clave = `${modo}:${numero}`;
  const previa = r.num.dataset.valor;
  if (previa !== clave) {
    r.num.dataset.valor = clave;
    if (modo === 'nada') r.num.textContent = '–';
    else if (previa === undefined || !previa.startsWith(modo + ':') || !st.inicializado) r.num.textContent = cant(numero);
    else animarNumero(r.num, Number(previa.split(':')[1]), numero);
  }
  const dias = diasPara(c);
  r.dias.textContent = dias <= 0 ? 'Hoy' : dias === 1 ? 'Mañana' : `${dias} días`;

  if (card.dataset.acciones !== v.estado) {
    card.dataset.acciones = v.estado;
    if (v.estado === 'EN_VENTA') r.acciones.replaceChildren(h('a', { class: 'comprar', href: c.link, target: '_blank', rel: 'noopener noreferrer', text: 'Comprar entrada' }), campana(c, 'icono'));
    else r.acciones.replaceChildren(campana(c, v.estado === 'AGOTADA' ? 'habiliten' : 'salgan'));
  }

  const detalle = [h('ul', { class: 'tandas' }, ordenadas.map(cajaTanda))];
  if (!v.hayOtraPorVenir) detalle.push(h('p', { class: 'sin-mas', text: 'Por ahora no hay otra venta cargada en egrefest. Puede que la carguen más adelante o que no haya.' }));
  if (v.estado === 'EN_VENTA' && v.disponibles !== null && v.total !== null) detalle.push(h('p', { class: 'total', text: `En total quedan ${cant(v.disponibles)} de ${cant(v.total)} a la venta` }));
  r.interior.replaceChildren(...detalle, r.cerrar);
}

function render() {
  const grilla = $('grilla');
  if (!st.datos) return;
  const visibles = st.datos.cenas.filter((c) => !pasada(c));
  const porCena = eventosPorCena();
  const contar = (k) => visibles.filter((c) => c.vista.estado === k).length;
  const q = sinAcentos(st.busqueda.trim());
  const lista = visibles
    .filter((c) => (st.tab === 'todas' || c.vista.estado === st.tab) && (!q || sinAcentos(c.nombre).includes(q)))
    .sort(st.orden === 'vendidas'
      ? (a, b) => vendidasDe(b) - vendidasDe(a) || Date.parse(a.fechaInicio) - Date.parse(b.fechaInicio)
      : (a, b) => Date.parse(a.fechaInicio) - Date.parse(b.fechaInicio));

  $('resumen').replaceChildren(h('b', { text: String(contar('EN_VENTA')) }), ` en venta ahora, de ${visibles.length} ${visibles.length === 1 ? 'cena' : 'cenas'}`);
  $('pestanas').replaceChildren(...PESTANAS.map(([k, label]) => h('button', { type: 'button', role: 'tab', 'aria-selected': String(st.tab === k), 'data-tab': k },
    label, h('span', { class: 'n', text: String(k === 'todas' ? visibles.length : contar(k)) }))));

  const vivos = new Set(lista.map((c) => c.id));
  for (const [id, card] of st.cards) if (!vivos.has(id)) { card.remove(); st.cards.delete(id); }
  lista.forEach((c, i) => {
    let card = st.cards.get(c.id);
    if (!card) { card = crearCard(c); st.cards.set(c.id, card); }
    actualizarCard(card, c, porCena.get(c.id) ?? []);
    if (grilla.children[i] !== card) grilla.insertBefore(card, grilla.children[i] ?? null);
  });
  grilla.querySelector('.vacio')?.remove();
  if (!lista.length) grilla.append(h('p', { class: 'vacio', text: 'No hay cenas que coincidan.' }));
  renderNotificadas();
  if (!$('hoja').hidden) renderHistorial();
}

function renderCabecera() {
  if (!st.datos) return;
  const min = (Date.now() - Date.parse(st.datos.ultimaRevision)) / 60000;
  $('revision').textContent = `En vivo, revisado ${haceSeg(st.datos.ultimaRevision)}`;
  const atrasado = min > MIN_ATRASO;
  $('punto').classList.toggle('atrasado', atrasado);
  if (atrasado === st.conAviso) return;
  st.conAviso = atrasado;
  $('aviso').replaceChildren(atrasado ? h('p', { class: 'aviso', role: 'alert', text: `Atención: la última revisión tiene más de ${MIN_ATRASO} minutos. Los datos pueden estar desactualizados.` }) : '');
}

function etiquetaDia(clave) {
  const hoy = diaAR(new Date());
  if (clave === hoy) return 'Hoy';
  if (clave === diaAR(new Date(Date.now() - 86400000))) return 'Ayer';
  const p = partesFecha(new Date(`${clave}T12:00:00-03:00`), { weekday: 'long', day: 'numeric', month: 'long' });
  return `${capital(p.weekday)} ${p.day} de ${p.month}`;
}

function renderHistorial() {
  const todos = st.historial.filter((e) => !e.id.startsWith('PRUEBA') && describirEvento(e));
  const visibles = todos.slice(0, st.histVisibles);
  const hoy = diaAR(new Date());
  const nodos = [];
  let dia = null;
  for (const e of visibles) {
    const clave = diaAR(new Date(e.fecha));
    if (clave !== dia) { dia = clave; nodos.push(h('h3', { class: 'hist-dia', text: etiquetaDia(clave) })); }
    const d = describirEvento(e);
    const circ = h('span', { class: 'circ', text: d.icono, 'aria-hidden': 'true' });
    circ.style.background = d.color;
    const hora = clave === hoy ? hace(e.fecha) : new Intl.DateTimeFormat('es-AR', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: ZONA }).format(new Date(e.fecha));
    nodos.push(h('div', { class: 'hist-fila' }, circ, h('div', { class: 'hist-texto' }, h('b', { text: e.cenaNombre }), d.texto), h('span', { class: 'hist-hora', text: hora })));
  }
  if (!visibles.length) nodos.push(h('p', { class: 'hist-vacio', text: 'Todavía no hay cambios registrados.' }));
  if (todos.length > visibles.length) {
    const mas = h('button', { class: 'hist-mas', type: 'button', text: 'Ver más' });
    mas.addEventListener('click', () => { st.histVisibles += PAGINA_HISTORIAL; renderHistorial(); });
    nodos.push(mas);
  }
  const cuerpo = $('hoja-cuerpo');
  const alto = cuerpo.scrollTop;
  cuerpo.replaceChildren(...nodos);
  cuerpo.scrollTop = alto;
}

function abrirHistorial() {
  st.histVisibles = PAGINA_HISTORIAL;
  renderHistorial();
  $('hoja').hidden = false;
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => requestAnimationFrame(() => { $('hoja').classList.add('abierta'); $('hoja-cerrar').focus(); }));
}
function cerrarHistorial() {
  $('hoja').classList.remove('abierta');
  document.body.style.overflow = '';
  setTimeout(() => { $('hoja').hidden = true; }, reducirMovimiento() ? 0 : 300);
  $('abrir-historial').focus();
}

const sbGet = async (ruta) => {
  const r = await fetch(`${SB_URL}/${ruta}`, { headers: { apikey: SB_KEY, authorization: `Bearer ${SB_KEY}` }, cache: 'no-store' });
  if (!r.ok) throw new Error(r.status);
  return r.json();
};

async function cargar() {
  if (st.cargando) return;
  st.cargando = true;
  try {
    const rutaHistorial = st.ultimaFechaHist
      ? `historial?select=datos&order=fecha.desc&fecha=gte.${encodeURIComponent(st.ultimaFechaHist)}`
      : `historial?select=datos&order=fecha.desc&limit=${MAX_HISTORIAL}`;
    const [cenas, rev, nuevos] = await Promise.all([sbGet('cenas?select=datos'), sbGet('revision?select=ultima_revision,desde'), sbGet(rutaHistorial)]);
    if (!rev.length) {
      if (!st.datos) $('revision').textContent = 'Todavía no hay datos publicados.';
      return;
    }
    const datos = { ultimaRevision: rev[0].ultima_revision, desde: rev[0].desde, cenas: cenas.map((f) => f.datos) };
    const porId = new Map(st.historial.map((e) => [e.id, e]));
    for (const f of nuevos) porId.set(f.datos.id, f.datos);
    const historial = [...porId.values()].sort((a, b) => Date.parse(b.fecha) - Date.parse(a.fecha)).slice(0, MAX_HISTORIAL);
    const firma = JSON.stringify([datos.cenas, historial.length, historial[0]?.id]);
    const cambio = firma !== st.firma;
    Object.assign(st, { datos, historial, firma, ultimaFechaHist: historial[0]?.fecha ?? st.ultimaFechaHist });
    renderCabecera();
    if (cambio) render();
    st.inicializado = true;
  } catch {
    if (!st.datos) $('revision').textContent = 'No se pudieron cargar los datos. Reintentando…';
  } finally {
    st.cargando = false;
  }
}

function cerrarMenu() {
  $('menu-orden').hidden = true;
  $('ordenar').setAttribute('aria-expanded', 'false');
}
function renderMenuOrden() {
  $('menu-orden').replaceChildren(...ORDENES.map(([k, label]) => {
    const b = h('button', { type: 'button', role: 'menuitemradio', 'aria-checked': String(st.orden === k), text: label });
    b.addEventListener('click', () => { st.orden = k; cerrarMenu(); renderMenuOrden(); render(); });
    return b;
  }));
}
$('ordenar').addEventListener('click', (e) => {
  e.stopPropagation();
  const abrir = $('menu-orden').hidden;
  $('menu-orden').hidden = !abrir;
  $('ordenar').setAttribute('aria-expanded', String(abrir));
});
document.addEventListener('click', (e) => { if (!e.target.closest('#menu-orden')) cerrarMenu(); });
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  cerrarMenu();
  if (!$('hoja').hidden) cerrarHistorial();
});
$('pestanas').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  st.tab = b.dataset.tab;
  render();
});
$('abrir-historial').addEventListener('click', abrirHistorial);
$('hoja-cerrar').addEventListener('click', cerrarHistorial);
$('hoja-fondo').addEventListener('click', cerrarHistorial);
$('notif-toggle').addEventListener('click', () => {
  const abrir = $('notif-cuerpo').hidden;
  $('notif-cuerpo').hidden = !abrir;
  $('notif-toggle').setAttribute('aria-expanded', String(abrir));
});

$('todas').addEventListener('click', () => alternarAviso('todas'));
pintarCampana($('todas'), 'todas');
$('buscador').addEventListener('input', (e) => { st.busqueda = e.target.value; render(); });
renderMenuOrden();
cargar();
setInterval(cargar, REFRESCO_MS);
setInterval(renderCabecera, 1000);
setInterval(render, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) cargar(); });
</script>
</body>
</html>
